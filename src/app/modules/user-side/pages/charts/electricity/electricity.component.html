<div class="overflow-x-hidden">
      <div class="overflow-hidden bg-black pt-[82px] sm:-mx-[250px] sm:rounded-b-[50%] lg:-mx-[150px] lg:pt-[106px]">

            <div class="container relative bg-[url(/assets/images/world-map.png)] bg-cover">
                  <div class="flex flex-col items-center gap-7 lg:flex-row">
                        <div
                              class="flex-1 pb-14 pt-14 text-white text-center rtl:text-center lg:max-w-full lg:pb-52 lg:!text-left rtl:lg:!text-right xl:pt-36">
                              <h2 class="text-xl font-extrabold sm:text-xl lg:!text-[70px] lg:leading-[89px]">
                                    Electricity
                              </h2>
                        </div>
                  </div>
            </div>
      </div>

      <section
            class="bg-gradient-to-b from-transparent to-white/[55%] py-10 dark:bg-gradient-to-t dark:from-white/5 dark:to-transparent lg:py-20">
            <div class="container">
                  <div class="heading text-center">
                        <!-- <h6 class="!text-secondary">Electricity</h6> -->
                        <h4>Electricity Indicators</h4>
                            

                    <!-- Year -->

                                @for (year of year; track year) {
                                  <mat-option [value]="year.value">{{year.viewValue}}</mat-option>
                                }
                              </mat-select>
                        </mat-form-field>

                    </div> -->
                            
                  </div>
            </div>
      </section>

      <mat-tab-group>
            <mat-tab>
                  <ng-template mat-tab-label>Metrics and Indexes</ng-template>
                  <div class="flex flex-row px-6 pb-2 gap-3 my-24">
                        <!-- <mat-form-field class="w-1/2">
                              <mat-label>Petroleum</mat-label>
                              <input (input)="getPetroleumProducts($event)" type="text" matInput
                              [(ngModel)]="selectedProduct"
                                    [matAutocomplete]="auto1">
                              <mat-autocomplete #auto1="matAutocomplete" [displayWith]="displayFn" (optionSelected)="onProductSelected($event)">
                                    @for (petroleumProduct of petroleumProduct ; track trackByFn) {
                                    <mat-option [value]="petroleumProduct">{{petroleumProduct.name}}</mat-option>
                                    }
                              </mat-autocomplete>
                        </mat-form-field> -->
                        <mat-form-field class="w-1/2">
                              <mat-label>Country</mat-label>
                              <mat-select [formControl]="country" multiple>
                                    @for (country of countryList ; track trackByFn) {
                                          <mat-option (click)="onCountryClicked($event,country)" [value]="country.id">{{country.name}}</mat-option>
                                    }
                              </mat-select>
                        </mat-form-field> 
                    </div>
                  <div>
                        <section class="relative bg-white pt-14 m-10 lg:pb-48 lg:pt-[100px]">
                              <div echarts [options]="chartOption" class="demo-chart"></div>
                        </section>
                  
                        <section class="relative bg-white pt-14 m-10 lg:pb-48 lg:pt-[100px]">
                              <div echarts [options]="chartOption2" class="demo-chart"></div>
                        </section>
                  
                        <section class="relative bg-white pt-14 m-10 lg:pb-48 lg:pt-[100px]">
                              <div echarts [options]="chartOption3" class="demo-chart"></div>
                        </section>
                  
                        <section class="relative bg-white pt-14 m-10 lg:pb-48 lg:pt-[100px]">
                              <div echarts [options]="chartOption4" class="demo-chart"></div>
                        </section>

                        <section class="relative bg-white pt-14 m-10 lg:pb-48 lg:pt-[100px]">
                              <div echarts [options]="chartOption5" class="demo-chart"></div>
                        </section>
                        <section class="relative bg-white pt-14 m-10 lg:pb-48 lg:pt-[100px]">
                              <div echarts [options]="chartElectricityAccessRate" class="demo-chart"></div>
                        </section>
                  </div>
            </mat-tab>
            <mat-tab>
                  <ng-template mat-tab-label>User Tariffs</ng-template>
                  <chart-user-tariffs></chart-user-tariffs>
            </mat-tab>
            <mat-tab>
                  <ng-template mat-tab-label>Generation</ng-template>
                  <chart-generation-mix></chart-generation-mix>
            </mat-tab>
            <mat-tab>
                  <ng-template mat-tab-label>SAIDI</ng-template>
                  <chart-saidi></chart-saidi>
            </mat-tab>
            <mat-tab>
                  <ng-template mat-tab-label>SAIFI</ng-template>
                  <chart-saifi></chart-saifi>
            </mat-tab>
            <mat-tab>
                  <ng-template mat-tab-label>System Load factor</ng-template>
                  <chart-system-load-factor></chart-system-load-factor>
            </mat-tab>
            <mat-tab>
                  <ng-template mat-tab-label>Capacity</ng-template>
                  <chart-capacity></chart-capacity>
            </mat-tab>

            <mat-tab>
                  <ng-template mat-tab-label>Cross-Boder Power Exchange Tariff</ng-template>
                  <chart-cross-border-power></chart-cross-border-power>
            </mat-tab>

            <mat-tab>
                  <ng-template mat-tab-label>Grid Connectivity</ng-template>
                  <chart-grid-connectivity></chart-grid-connectivity>
            </mat-tab>
