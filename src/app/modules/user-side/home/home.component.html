    <app-public-header class="public-shell__header" [ngClass]="headerClass"></app-public-header>

    <div class="public-shell__content">
        <router-outlet></router-outlet>
    </div>

    <app-public-footer class="public-shell__footer"></app-public-footer>

    <!-- Return to Top -->
    <button *ngIf="showTopButton" type="button" class="fixed bottom-5 z-10 animate-bounce right-5 rtl:left-5" (click)="scrollToTop()">
        <div
            class="group flex h-14 w-14 items-center justify-center rounded-full border border-black/20 bg-black text-white transition duration-500 hover:bg-secondary dark:bg-primary dark:hover:bg-secondary"
        >
            <svg
                xmlns="http://www.w3.org/2000/svg"
                fill="none"
                viewBox="0 0 24 24"
                stroke-width="1.5"
                stroke="currentColor"
                class="h-6 w-6 transition group-hover:text-black"
            >
                <path stroke-linecap="round" stroke-linejoin="round" d="M4.5 15.75l7.5-7.5 7.5 7.5" />
            </svg>
        </div>
    </button>
</div>
