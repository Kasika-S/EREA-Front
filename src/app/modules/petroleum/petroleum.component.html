<div class="absolute inset-0 flex min-w-0 flex-col overflow-y-auto">
  <div class="flex flex-col">
    <!-- Main -->
    <div class="flex-auto">
      <!-- Header -->
      <div
        class="flex flex-auto flex-col justify-between border-b px-6 py-8 sm:flex-row md:flex-col md:px-8"
      >
        <!-- Title -->
        <div>
          <div class="text-4xl font-extrabold leading-none tracking-tight">
            Petroleum
          </div>
          <div class="text-secondary ml-0.5 font-medium">
            <!-- @if (contactsCount > 0) {
                                  {{ contactsCount }}
                              }
                              {{
                                  contactsCount
                                      | i18nPlural
                                          : {
                                                '=0': 'No contacts',
                                                '=1': 'contact',
                                                other: 'contacts',
                                            }
                              }} -->
            5 Products
          </div>
        </div>

        <!-- Main actions -->
        <div class="mt-4 flex items-center sm:mt-0 md:mt-4">
          <!-- Search -->
          <div class="flex-auto">
            <mat-form-field
              class="fuse-mat-dense fuse-mat-rounded w-full min-w-50"
              subscriptSizing="dynamic"
            >
              <mat-icon
                class="icon-size-5"
                matPrefix
                [svgIcon]="'heroicons_solid:magnifying-glass'"
              ></mat-icon>
              <!-- <input
                                      matInput
                                      [formControl]="searchInputControl"
                                      [autocomplete]="'off'"
                                      [placeholder]="'Search contacts'"
                                  /> -->
              <input
                matInput class="!p-3"
                [autocomplete]="'off'"
                [placeholder]="'Search contacts'"
              />
            </mat-form-field>
          </div>
          <!-- Add contact button -->
          <!-- <button
                              class="ml-4"
                              mat-flat-button
                              [color]="'primary'"
                              (click)="createContact()"
                          > -->
          <button
            class="ml-4"
            mat-flat-button
            [color]="'primary'"
            (click)="openDialog()"
          >
            <mat-icon [svgIcon]="'heroicons_outline:plus'"></mat-icon>
            <span class="ml-2 mr-1">Add</span>
          </button>
        </div>
      </div>

      <!-- Petroleum list -->
      <div class="relative">

        <div class="z-20 flex cursor-pointer items-center border-b px-6 py-4 md:px-8">
          <mat-form-field>
            <mat-label>Filter</mat-label>
            <input
              matInput
              (keyup)="applyFilter($event)"
              placeholder="Ex. ium"
              #input
            />
          </mat-form-field>
  
          <table mat-table [dataSource]="dataSource" class="mat-elevation-z8">
            <!-- Position Column -->
            <ng-container matColumnDef="position">
              <th mat-header-cell *matHeaderCellDef>No.</th>
              <td mat-cell *matCellDef="let element">{{ element.position }}</td>
            </ng-container>
  
            <!-- Name Column -->
            <ng-container matColumnDef="name">
              <th mat-header-cell *matHeaderCellDef>Name</th>
              <td mat-cell *matCellDef="let element">{{ element.name }}</td>
            </ng-container>
  
            <!-- Weight Column -->
            <ng-container matColumnDef="weight">
              <th mat-header-cell *matHeaderCellDef>Weight</th>
              <td mat-cell *matCellDef="let element">{{ element.weight }}</td>
            </ng-container>
  
            <!-- Symbol Column -->
            <ng-container matColumnDef="symbol">
              <th mat-header-cell *matHeaderCellDef>Symbol</th>
              <td mat-cell *matCellDef="let element">{{ element.symbol }}</td>
            </ng-container>
  
            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  
            <!-- Row shown when there is no matching data. -->
            <tr class="mat-row" *matNoDataRow>
              <td class="mat-cell" colspan="4">
                No data matching the filter "{{ input.value }}"
              </td>
            </tr>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>
