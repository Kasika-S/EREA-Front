<!-- Navigation -->

<vertical-navigation
    #mainNavigation
    class="admin-sidebar print:hidden"
    [mode]="isScreenSmall ? 'over' : 'side'"
    [name]="'mainNavigation'"
    [opened]="!isScreenSmall"
>

    <!-- Navigation header hook -->
    <ng-container fuseVerticalNavigationContentHeader>
        <!-- Logo -->
        <div class="flex h-20 items-center p-6 pb-0">
            <!-- Light version -->
            <!-- <img
                class="w-30 dark:hidden"
                src="../../assets/images/logo/logo-text.svg"
                alt="Logo image"
            /> -->
            <div class="admin-sidebar-brand"><span>EREA</span><small>DataHub workspace</small></div>
            <!-- Dark version -->
            <!-- <img
                class="hidden w-30 dark:flex"
                src="../../assets/images/logo-text-on-dark.svg"
                alt="Logo image"
            /> -->
        </div>
    </ng-container>
</vertical-navigation>

<!-- Wrapper -->
<div class="flex w-full min-w-0 flex-auto flex-col">
    <!-- Header -->
    <div
        class="admin-topbar relative z-49 flex justify-between h-16 w-full flex-0 items-center px-4 md:px-6 print:hidden"
    >
        <!-- Navigation toggle button -->
        <button mat-icon-button (click)="toggleNavigation('mainNavigation')">
            <mat-icon [svgIcon]="'heroicons_outline:bars-3'"></mat-icon>
        </button>
        <div class="admin-topbar-actions">
            <a class="admin-dashboard-link" routerLink="/admin">Dashboard</a>
            <button
                class="admin-home-link"
                mat-flat-button
                (click)="goToHome()"
              >
                <mat-icon [svgIcon]="'heroicons_outline:arrow-left'"></mat-icon>
                <span class="ml-2 mr-1">Back to home</span>
            </button>
            <button class="admin-signout-link" mat-button (click)="signOut()">Sign out</button>
        </div>
    </div>

    <!-- Content -->
    <div class="flex flex-auto flex-col">
        <!-- *ngIf="true" hack is required here for router-outlet to work correctly.
             Otherwise, layout changes won't be registered and the view won't be updated! -->
        @if (true) {
            <router-outlet></router-outlet>
        }
    </div>

    <!-- Footer -->
    <div
        class="admin-footer relative z-49 flex h-14 w-full flex-0 items-center justify-start px-4 md:px-6 print:hidden"
    >
        <span class="font-extrabold"
            >EREA &copy; {{ currentYear }}</span
        >
    </div>
</div>
