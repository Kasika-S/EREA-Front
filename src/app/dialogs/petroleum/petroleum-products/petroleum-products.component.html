<h2 mat-dialog-title>PETROLEUM PRODUCT</h2>
<mat-dialog-content class="mat-typography">
  <div class="flex flex-col flex-auto bg-white overflow-hidden">
    <div class="flex flex-col items-center hover:cursor-pointer text-md font-medium bg-primary text-primary px-8 py-6">
      <span class="text-lg text-primary-300">ADD PETROLEUM PRODUCT</span>
    </div>

    <div class="w-full p-4 mt-4">
      <form [formGroup]="petroleumForm" (ngSubmit)="saveInfo()">
        <div class="flex flex-col flex-auto">
          <!-- Name -->
          <div>
            <mat-form-field appearance="outline" class="w-full">
              <mat-label>Name</mat-label>
              <input matInput placeholder="Placeholder" [formControlName]="'name'" />
            </mat-form-field>
          </div>

           <!-- Select -->
          <!-- <div>
            <mat-form-field appearance="outline" class="w-full">
              <mat-label>Billing Category</mat-label>
              <mat-select (selectionChange)="checkInsurance($event.value)" [formControlName]="'billing_category'">
                @for (billing of billing; track billing.code) {
                <mat-option [value]="billing.code">{{ billing.name }}</mat-option>
                }
              </mat-select>
            </mat-form-field>
          </div> -->

          <div class="flex items-center justify-end sm:-mx-12 py-4 pr-4 pl-1 sm:pr-12 sm:pl-7 border-b">
            <button mat-stroked-button [matDialogClose]="'cancelled'">
              Cancel
            </button>

            <!-- Save -->
            <button class="m-2" mat-flat-button [color]="'primary'" [matTooltip]="'Save'" type="submit">
              Save
            </button>
          </div>
        </div>
      </form>
    </div>
  </div>
</mat-dialog-content>
