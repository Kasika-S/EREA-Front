<!-- preview-dialog.component.html -->

<div mat-dialog-content class="mat-typography">
  <div class="flex flex-col items-center hover:cursor-pointer text-md font-medium bg-primary text-primary px-8 py-6">
    <span class="text-lg text-primary-300">Preview Excel Data</span>
  </div>
  <table mat-table [dataSource]="dataSource" class="mat-elevation-z8">
    
    <!-- Dynamically generate columns based on displayedColumns -->
    <ng-container *ngFor="let column of displayedColumns" [matColumnDef]="column">
      <th mat-header-cell *matHeaderCellDef> {{ column }} </th>
      <td mat-cell *matCellDef="let element"> {{ element[column] }} </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>

  <!-- Paginator -->
  <mat-paginator [pageSize]="10" [pageSizeOptions]="[10, 25, 50]" showFirstLastButtons></mat-paginator>
</div>

<div mat-dialog-actions align="end">
  <!-- <button mat-button (click)="onCancel()">Cancel</button> -->
  <button mat-button color="primary" (click)="onUpload()">Done</button>
</div>
