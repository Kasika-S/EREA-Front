<h2 mat-dialog-title class="font-extrabold">Confirm Delete</h2>
<mat-dialog-content class="!mx-5">Are you sure you want to delete this item?</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close="no">No</button>
  <button mat-button color="warn" mat-dialog-close="yes">Yes</button>
</mat-dialog-actions>
